openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: marketing
    description: Server-side marketing content generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /marketing/status:
    get:
      operationId: getMarketingStatus
      tags: [marketing]
      summary: Check whether live marketing generation is configured
      responses:
        "200":
          description: Marketing generation configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingStatus"
  /marketing/generate:
    post:
      operationId: generateMarketing
      tags: [marketing]
      summary: Generate marketing captions for WhatsApp and Facebook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketingInput"
      responses:
        "200":
          description: Generated captions or clearly labeled demonstration captions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingOutput"
        "400":
          description: Invalid marketing request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The configured model provider failed to generate captions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MarketingStatus:
      type: object
      properties:
        configured:
          type: boolean
        model:
          type: ["string", "null"]
      required:
        - configured
        - model
    MarketingInput:
      type: object
      properties:
        businessType:
          type: string
          minLength: 1
          maxLength: 120
        productOrService:
          type: string
          minLength: 1
          maxLength: 240
        targetCustomers:
          type: string
          minLength: 1
          maxLength: 240
        platform:
          type: string
          enum: [WhatsApp, Facebook, Both]
        tone:
          type: string
          minLength: 1
          maxLength: 80
      required:
        - businessType
        - productOrService
        - targetCustomers
        - platform
        - tone
    MarketingOutput:
      type: object
      properties:
        mode:
          type: string
          enum: [demo, ai]
        whatsappCaption:
          type: string
        facebookCaption:
          type: string
        model:
          type: ["string", "null"]
      required:
        - mode
        - whatsappCaption
        - facebookCaption
        - model
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

